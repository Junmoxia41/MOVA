name: Android CI

# Verificación real de cada push: build + tests + lint (Mega Prompt §64, §106, §111).
# NO publica nada: solo compila y prueba. Publicar requiere autorización explícita
# del propietario (Límites §9).
#
# Los logs de ejecución se almacenan en un blob externo al que el entorno de
# desarrollo no tiene acceso, así que en caso de fallo el workflow publica las
# últimas líneas como comentario del commit. Es el canal de diagnóstico.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Inspect Android SDK
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version || true
          sdkmanager --list_installed || true

      - name: Install Android platform 37
        run: |
          set -x
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37" || true
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace lintDebug 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mova-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Report failure on commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ CI falló en \`${{ github.job }}\`"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -n 120 "$RUNNER_TEMP/ci.log" 2>/dev/null || echo "(sin log de Gradle: el fallo fue anterior)"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat "$RUNNER_TEMP/body.md")" > /dev/null
