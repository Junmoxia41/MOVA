name: Android CI

# Verificación real de cada push: build + tests + lint (Mega Prompt §64, §106, §111).
# NO publica nada: solo compila y prueba. Publicar requiere autorización explícita
# del propietario (Límites §9).
#
# Los logs de ejecución viven en un blob externo al que el entorno de desarrollo no
# tiene acceso, así que los resultados se publican como ANOTACIONES (legibles por API)
# y los fallos como comentario del commit. Ese es el canal de diagnóstico.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Aplicar las migraciones SQL al proyecto Supabase (usa SUPABASE_DB_URL)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 37
        run: |
          set -x
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Report test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          total = failures = errors = skipped = 0
          suites = []
          for f in files:
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0))
              failures += int(r.get("failures", 0))
              errors += int(r.get("errors", 0))
              skipped += int(r.get("skipped", 0))
              suites.append(os.path.basename(f).replace("TEST-", "").replace(".xml", ""))
          if not files:
              print("::error::No se generó ningún XML: los tests no se ejecutaron")
              raise SystemExit(1)
          print(f"::notice::Unit tests: {total} ejecutados, {failures} fallidos, "
                f"{errors} errores, {skipped} omitidos")
          for name in sorted(suites):
              print(f"::notice::  suite {name}")
          if failures or errors:
              raise SystemExit(1)
          PY

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace lintDebug 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mova-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Report failure on commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ CI falló en \`${{ github.job }}\`"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -n 120 "$RUNNER_TEMP/ci.log" 2>/dev/null || echo "(sin log de Gradle: el fallo fue anterior)"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat "$RUNNER_TEMP/body.md")" > /dev/null

  supabase:
    name: Supabase connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check credentials
        id: creds
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Omitido: faltan los secrets SUPABASE_URL y SUPABASE_ANON_KEY"
            echo "::notice::Añádelos en Settings → Secrets and variables → Actions"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Verify REST endpoint
        if: steps.creds.outputs.available == 'true'
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/rest/v1/" -H "apikey: $KEY")
          echo "::notice::GET /rest/v1/ → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase no respondió 200 (HTTP $code): URL o clave incorrectas"
            exit 1
          fi

      - name: Report schema state
        if: steps.creds.outputs.available == 'true'
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ok=0; missing=0
          for t in profiles service_areas driver_plans drivers vehicles driver_availability \
                   bookings reviews favorites subscriptions notifications app_config \
                   audit_logs sync_metadata; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "$URL/rest/v1/$t?select=*&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            if [ "$code" = "200" ]; then
              ok=$((ok + 1)); echo "::notice::  ✓ $t"
            else
              missing=$((missing + 1)); echo "::notice::  ✗ $t (HTTP $code)"
            fi
          done
          echo "::notice::Esquema aplicado: $ok de 14 tablas responden; $missing no"

  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Solo bajo demanda explícita: escribir DDL en una base real nunca es automático
    # (Límites §5 y §6: detenerse ante operaciones sobre datos reales).
    if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check connection string
        id: db
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Falta el secret SUPABASE_DB_URL (Settings → Secrets → Actions)"
            echo "::notice::Es la connection string de Settings → Database → Connection string (URI)"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Ensure psql
        run: |
          if ! command -v psql > /dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Apply migrations in order
        if: steps.db.outputs.available == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            if psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$f" 2>&1 | tee -a "$RUNNER_TEMP/mig.log"; then
              echo "::notice::  ✓ aplicado $f"
            else
              echo "::error::  ✗ FALLÓ $f (se detiene aquí)"
              exit 1
            fi
            echo "::endgroup::"
          done
          echo "::notice::Todas las migraciones aplicadas"

      - name: Report failure on commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ❌ Migración fallida"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -n 80 "$RUNNER_TEMP/mig.log" 2>/dev/null || echo "(sin log)"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments"             -f body="$(cat "$RUNNER_TEMP/body.md")" > /dev/null
